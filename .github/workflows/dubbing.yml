name: Pro Ultra-Precise Transcription Pipeline

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: 'Direct or Google Drive Public URL to the audio file'
        required: true
        default: ''

jobs:
  run-dubbing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 build-essential

      - name: Install Heavy AI & Audio Processing Libraries
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir openai-whisper soundfile librosa numpy requests gTTS tqdm

      - name: Download and Verify Real Audio File
        env:
          AUDIO_URL: ${{ github.event.inputs.audio_url }}
        run: |
          python -c "
          import os, requests, sys
          url = os.environ.get('AUDIO_URL')
          if not url:
              print('❌ خطأ: لم تقم بإدخال رابط!')
              sys.exit(1)
          
          if 'drive.google.com' in url:
              if 'id=' in url:
                  file_id = url.split('id=')[1].split('&')[0]
              elif '/file/d/' in url:
                  file_id = url.split('/file/d/')[1].split('/')[0]
              else:
                  file_id = ''
              if file_id:
                  url = f'https://drive.google.com/uc?export=download&id={file_id}'
          
          session = requests.Session()
          response = session.get(url, stream=True)
          for key, value in response.cookies.items():
              if key.startswith('download_warning'):
                  params = {'export': 'download', 'confirm': value, 'id': file_id}
                  response = session.get('https://drive.google.com/uc', params=params, stream=True)
                  break

          if response.status_code == 200:
              with open('input_audio.mp3', 'wb') as f:
                  for chunk in response.iter_content(chunk_size=1024*1024):
                      if chunk: f.write(chunk)
              size = os.path.getsize('input_audio.mp3')
              print(f'📁 حجم الملف المحمل: {size / (1024*1024):.2f} MB')
              if size < 50000:
                  print('❌ الملف صغيراً جداً أو غير صالح!')
                  sys.exit(1)
          else:
              print('❌ فشل تحميل الملف من الرابط.')
              sys.exit(1)
          "

      - name: Run Ultra-Precise AI Transcription (Large-v3)
        run: |
          python -c "
          import os, sys, whisper
          
          audio_path = 'input_audio.mp3'
          print('🧠 جاري تحميل أقوى نموذج ذكاء اصطناعي تفريغي (Whisper large-v3)... قد يستغرق التحميل دقيقة نظراً لحجمه وضخامة دقته...')
          
          # استخدام النموذج الأضخم والأدق عالمياً large-v3
          model = whisper.load_model('large-v3')
          
          print('🎙️ جاري تفريغ الصوت بأقصى درجات الدقة والاحترافية...')
          # تفعيل خيارات البحث المتقدمة لتقليل نسبة الخطأ للصفر تقريباً
          result = model.transcribe(
              audio_path,
              beam_size=5,             # بحث متعمق لضمان اختيار الكلمات الأصح
                # تجاهل تكرار الكلمات الوهمي
              condition_on_previous_text=True
          )
          
          full_text = result.get('text', '')
          print(f'📝 إجمالي النص المفرغ المستخرج: {len(full_text)} حرف')
          print('--- عينة دقيقة من النص المستخرج ---')
          print(full_text[:1200])
          print('----------------------------------')
          
          if not full_text.strip():
              print('❌ النص المفرغ فارغ تماماً!')
              sys.exit(1)
              
          with open('transcription_text.txt', 'w', encoding='utf-8') as tf:
              tf.write(full_text)
          print('✅ تم حفظ النص الاحترافي الدقيق بنجاح!')
          "

      - name: Generate Final Dubbed Audio
        run: |
          python -c "
          import os, sys
          from gtts import gTTS
          
          if not os.path.exists('transcription_text.txt'):
              sys.exit(1)
              
          with open('transcription_text.txt', 'r', encoding='utf-8') as tf:
              text_to_dub = tf.read()
              
          print('🗣️ جاري توليد ملف الدبلجة النهائي بناءً على النص الدقيق...')
          tts = gTTS(text=text_to_dub, lang='ar') # أو 'en' لو الملف مترجم
          tts.save('dubbed_output.mp3')
          print('✅ تم الإنشاء بنجاح!')
          "

      - name: Upload Ultra-Precise Audio Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dubbed-audio-result
          path: dubbed_output.mp3
