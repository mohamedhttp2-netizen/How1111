name: Audio Dubbing Pipeline

on:
  workflow_dispatch:

jobs:
  run-dubbing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai-whisper pyannote.audio torch soundfile librosa requests

      - name: Run Test Script
        run: |
          echo "🚀 تم تشغيل سيرفر جيت هاب بنجاح، وبيئة العمل جاهزة لمعالجة الصوت!"
          python -c "import torch; print('GPU/CPU Available:', torch.cuda.is_available())"
          
