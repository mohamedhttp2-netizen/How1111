name: Audio Dubbing Pipeline

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: 'Direct or Google Drive Public URL to the audio file'
        required: true
        default: ''

jobs:
  run-dubbing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python AI & Audio Packages
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install openai-whisper soundfile librosa numpy requests gTTS

      - name: Download and Validate Audio File
        env:
          AUDIO_URL: ${{ github.event.inputs.audio_url }}
        run: |
          python -c "
          import os, requests
          url = os.environ.get('AUDIO_URL')
          if not url:
              raise Exception('❌ خطأ: لم تقم بإدخال أي رابط للصوت!')
          
          print(f'🔗 الرابط المدخل: {url}')
          if 'drive.google.com' in url:
              if 'id=' in url:
                  file_id = url.split('id=')[1].split('&')[0]
              elif '/file/d/' in url:
                  file_id = url.split('/file/d/')[1].split('/')[0]
              else:
                  file_id = ''
              
              if file_id:
                  # Google Drive direct download with confirm token for large files
                  url = f'https://drive.google.com/uc?export=download&id={file_id}'
          
          print('📥 جاري بدء تحميل الملف...')
          session = requests.Session()
          response = session.get(url, stream=True)
          
          # Handle Google Drive confirmation page for large files
          for key, value in response.cookies.items():
              if key.startswith('download_warning'):
                  print('⚠️ تم اكتشاف صفحة تحذير جوجل درايف للملفات الكبيرة، جاري تجاوزها...')
                  params = {'export': 'download', 'confirm': value, 'id': file_id}
                  response = session.get('https://drive.google.com/uc', params=params, stream=True)
                  break

          if response.status_code == 200:
              with open('input_audio.mp3', 'wb') as f:
                  for chunk in response.iter_content(8192):
                      f.write(chunk)
              
              file_size = os.path.getsize('input_audio.mp3')
              print(f'📁 حجم الملف المحمل: {file_size} بايت')
              if file_size < 1000:
                  print('❌ تحذير: الملف المحمل صغير جداً وقد يكون صفحة خطأ وليس ملف صوت!')
                  with open('input_audio.mp3', 'r', errors='ignore') as inf:
                      print(inf.read()[:300])
                  raise Exception('فشل تحميل الملف الحقيقي من الرابط.')
              else:
                  print('✅ تم تحميل الملف الصوتي الحقيقي والتحقق منه بنجاح!')
          else:
              raise Exception(f'❌ فشل التحميل، كود الاستجابة: {response.status_code}')
          "

      - name: Full Transcription and Dubbing Generation
        run: |
          python -c "
          import os, whisper
          from gtts import gTTS
          
          if os.path.exists('input_audio.mp3') and os.path.getsize('input_audio.mp3') > 1000:
              print('🎙️ جاري تفريغ الصوت وتحليله عبر نموذج Whisper...')
              model = whisper.load_model('base')
              result = model.transcribe('input_audio.mp3')
              full_text = result['text']
              print(f'📝 النص المفرغ المستخرج ({len(full_text)} حرف):')
              print(full_text[:600])
              
              if full_text.strip():
                  print('🗣️ جاري تحويل النص المفرغ إلى ملف صوتي مدبلج...')
                  tts = gTTS(text=full_text, lang='en')
                  tts.save('dubbed_output.mp3')
                  print('✅ تم إنشاء ملف الدبلجة الحقيقي بنجاح!')
              else:
                  raise Exception('⚠️ النص المفرغ فارغ ولم يتم العثور على كلمات واضحة في الصوت.')
          else:
              raise Exception('❌ لا يوجد ملف صوتي صالح للمعالجة.')
          "

      - name: Upload Dubbed Audio Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dubbed-audio-result
          path: dubbed_output.mp3
