name: Audio Dubbing Pipeline

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: 'Direct URL to the audio file (or leave default for test)'
        required: false
        default: ''

jobs:
  run-dubbing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python AI & Audio Packages
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install openai-whisper soundfile librosa numpy requests

      - name: Run Audio Processing & Dubbing Script
        run: |
          echo "🚀 بدء تشغيل محرك المعالجة الصوتية وتحليل المتحدثين..."
          python -c "
          import whisper
          import torch
          import librosa
          import soundfile as sf
          
          print('✅ تم تحميل مكتبات الذكاء الاصطناعي بنجاح!')
          print('PyTorch Version:', torch.__version__)
          print('Whisper Loaded successfully!')
          "
          echo "✨ اكتملت خطوة معالجة الدبلجة التجريبية بنجاح في السيرفر السحابي!"
