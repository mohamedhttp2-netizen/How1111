name: Audio Dubbing Pipeline

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: 'Direct or Google Drive Public URL to the audio file'
        required: true
        default: ''

jobs:
  run-dubbing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Install Python AI & Audio Packages
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install openai-whisper soundfile librosa numpy requests gTTS

      - name: Download and Process Audio File
        env:
          AUDIO_URL: ${{ github.event.inputs.audio_url }}
        run: |
          python -c "
          import os, requests
          url = os.environ.get('AUDIO_URL')
          if url:
              if 'drive.google.com' in url and 'id=' in url:
                  file_id = url.split('id=')[1].split('&')[0]
                  url = f'https://drive.google.com/uc?export=download&id={file_id}'
              elif 'drive.google.com/file/d/' in url:
                  file_id = url.split('/file/d/')[1].split('/')[0]
                  url = f'https://drive.google.com/uc?export=download&id={file_id}'
              res = requests.get(url, stream=True)
              if res.status_code == 200:
                  with open('input_audio.mp3', 'wb') as f:
                      for chunk in res.iter_content(8192): f.write(chunk)
                  print('✅ تم تحميل الملف بنجاح!')
          "

      - name: Full Transcription and Dubbing Generation
        run: |
          python -c "
          import os, whisper
          from gtts import gTTS
          
          if os.path.exists('input_audio.mp3'):
              print('🎙️ جاري تفريغ الصوت بالكامل...')
              model = whisper.load_model('base')
              result = model.transcribe('input_audio.mp3')
              full_text = result['text']
              print(f'📝 النص المفرغ الكامل ({len(full_text)} حرف):')
              print(full_text[:500])
              
              if full_text.strip():
                  print('🗣️ جاري تحويل النص بالكامل إلى ملف صوتي...')
                  tts = gTTS(text=full_text, lang='en')
                  tts.save('dubbed_output.mp3')
                  print('✅ تم إنشاء ملف الدبلجة الكامل بنجاح!')
              else:
                  print('⚠️ النص المفرغ فارغ!')
          "

      - name: Upload Dubbed Audio Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dubbed-audio-result
          path: dubbed_output.mp3
