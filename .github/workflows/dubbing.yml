name: Robust Pro Audio Dubbing Pipeline

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: 'Direct or Google Drive Public URL to the audio file'
        required: true
        default: ''

jobs:
  run-dubbing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies & FFmpeg
        run: |
          echo "🔄 جاري تحديث ونظام التشغيل وتثبيت حزم النظام المطلوبة (ffmpeg)..."
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 build-essential

      - name: Install Heavy AI & Audio Processing Libraries
        run: |
          echo "🔄 جاري تثبيت أحدث مكتبات PyTorch و Whisper و Librosa..."
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir openai-whisper soundfile librosa numpy requests gTTS tqdm

      - name: Download and Verify Real Audio File
        env:
          AUDIO_URL: ${{ github.event.inputs.audio_url }}
        run: |
          python -c "
          import os, requests, sys
          url = os.environ.get('AUDIO_URL')
          if not url:
              print('❌ خطأ قاتل: لم تقم بإدخال أي رابط للصوت!')
              sys.exit(1)
          
          print(f'🔗 الرابط المستلم: {url}')
          
          # معالجة روابط جوجل درايف بدقة للتأكد من التحميل المباشر
          if 'drive.google.com' in url:
              if 'id=' in url:
                  file_id = url.split('id=')[1].split('&')[0]
              elif '/file/d/' in url:
                  file_id = url.split('/file/d/')[1].split('/')[0]
              else:
                  file_id = ''
              
              if file_id:
                  url = f'https://drive.google.com/uc?export=download&id={file_id}'
          
          print('📥 جاري تحميل الملف الصوتي الحقيقي...')
          session = requests.Session()
          response = session.get(url, stream=True)
          
          # تجاوز صفحات التحذير الخاصة بالملفات الكبيرة في جوجل درايف
          for key, value in response.cookies.items():
              if key.startswith('download_warning'):
                  print('⚠️ تم اكتشاف صفحة فحص الفيروسات/الحجم الكبير في جوجل درايف، جاري تجاوزها والتأكيد...')
                  params = {'export': 'download', 'confirm': value, 'id': file_id}
                  response = session.get('https://drive.google.com/uc', params=params, stream=True)
                  break

          if response.status_code == 200:
              output_filename = 'input_audio.mp3'
              with open(output_filename, 'wb') as f:
                  for chunk in response.iter_content(chunk_size=1024*1024): # تحميل بحجم 1 ميجابايت للتشังكس
                      if chunk:
                          f.write(chunk)
              
              file_size = os.path.getsize(output_filename)
              file_size_mb = file_size / (1024 * 1024)
              print(f'📊 تم التحميل بنجاح! اسم الملف: {output_filename}')
              print(f'📏 حجم الملف الحقيقي على السيرفر: {file_size_mb:.2f} ميجابايت ({file_size} بايت)')
              
              if file_size < 50000: # أقل من 50 كيلوبايت معناه أنه ليس ملف صوت حقيقي بل صفحة خطأ أو HTML
                  print('❌ خطأ خطير: الملف المحمل صغير بشكل غير منطقي (يبدو أنه صفحة ويب أو خطأ تحميل وليس ملف صوت)!')
                  with open(output_filename, 'r', errors='ignore') as inf:
                      print('محتوى الملف الوهمي:', inf.read()[:400])
                  sys.exit(1)
          else:
              print(f'❌ فشل التحميل من الرابط، كود الاستجابة HTTP: {response.status_code}')
              sys.exit(1)
          "

      - name: Run Deep AI Transcription (Whisper)
        run: |
          python -c "
          import os, sys, whisper
          
          audio_path = 'input_audio.mp3'
          if not os.path.exists(audio_path):
              print('❌ الملف الصوتي غير موجود محلياً للمعالجة!')
              sys.exit(1)
              
          print('🧠 جاري تحميل نموذج Whisper القوي (medium)... هذه الخطوة قد تستغرق دقيقة لتحميل النموذج الأساسي...')
          # نستخدم نموذج 'medium' لضمان دقة عالية جداً في التفريغ والتعرف على الكلمات
          model = whisper.load_model('medium')
          
          print('🎙️ جاري بدء عملية تفريغ الصوت وتحويله إلى نص (Transcription)... يرجى الانتظار...')
          result = model.transcribe(audio_path, verbose=True)
          full_text = result.get('text', '')
          
          print(f'📝 طول النص المفرغ المستخرج: {len(full_text)} حرف')
          print('--- عينة من النص المستخرج ---')
          print(full_text[:1000])
          print('----------------------------')
          
          if not full_text.strip():
              print('❌ تحذير: النص المفرغ طلع فارغاً تماماً! الصوت قد يكون غير واضح أو صامتاً.')
              sys.exit(1)
              
          # حفظ النص المفرغ في ملف نصي لمراجعته والتحقق منه في السجلات
          with open('transcription_text.txt', 'w', encoding='utf-8') as tf:
              tf.write(full_text)
          print('✅ تم حفظ النص المفرغ بنجاح في ملف transcription_text.txt')
          "

      - name: Generate Real Final Dubbed Audio
        run: |
          python -c "
          import os, sys
          from gtts import gTTS
          
          if not os.path.exists('transcription_text.txt'):
              print('❌ ملف النص المفرغ غير موجود!')
              sys.exit(1)
              
          with open('transcription_text.txt', 'r', encoding='utf-8') as tf:
              text_to_dub = tf.read()
              
          if not text_to_dub.strip():
              print('❌ النص المراد دبلجته فارغ!')
              sys.exit(1)
              
          print('🗣️ جاري تحويل النص الحقيقي المفرغ إلى ملف صوتي مدبلج (TTS)...')
          # ملاحظة: لو النص عربي، lang='ar'، لو إنجليزي يمكن تعديله أو تركه حسب لغة الملف
          tts = gTTS(text=text_to_dub, lang='ar')
          tts.save('dubbed_output.mp3')
          
          out_size = os.path.getsize('dubbed_output.mp3')
          print(f'✅ تم إنتاج ملف الدبلجة النهائي بنجاح! حجم الملف الناتج: {out_size} بايت')
          "

      - name: Upload Real Dubbed Audio Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dubbed-audio-result
          path: dubbed_output.mp3
